# pbs-api.adammz.pl — .htaccess dla document root = backend root (gdy NIE można
# ustawić document root na public/). Użyj TEGO pliku w folderze pbs-api/ (document
# root subdomeny), a NIE pliku z public/.htaccess.
#
# Działa tylko, gdy struktura na serwerze to:
#   pbs-api/            <- document root (pbs-api.adammz.pl)  ← ten .htaccess tutaj
#   ├── public/         <- index.php (front controller)
#   ├── .env            <- blokowany przed dostępem z sieci
#   ├── src/            <- blokowany
#   └── vendor/         <- blokowany
#
# Jeśli możesz ustawić document root na pbs-api/public — zrób to (Opcja A) i użyj
# public/.htaccess. Ten plik to fallback (Opcja B).

<IfModule mod_rewrite.c>
    RewriteEngine On

    # === Blokada plików wrażliwych (poza public/) ===
    # .env zawiera sekrety (baza, JWT, SMTP) — NIE może być dostępny z sieci.
    RewriteRule ^\.env$ - [F,L]
    # Kod źródłowy, zależności, migracje, seedy, bin — nie serwować przez Apache.
    RewriteRule ^(src|vendor|migrations|seeds|bin)(/|$) - [F,L]
    RewriteRule ^composer\.(json|lock)$ - [F,L]
    RewriteRule ^pest\.php$ - [F,L]

    # === Front controller — /api/v1/* → public/index.php ===
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ public/index.php [QSA,L]
</IfModule>

# === CORS — nagłówki na WSZYSTKICH odpowiedziach ===
# "Header always set" gwarantuje dodanie także do 204 (preflight) i błędów.
# Origin konkretny (nie "*"), bo frontend używa withCredentials:true.
<IfModule mod_headers.c>
    Header always set Access-Control-Allow-Origin "https://pbs.adammz.pl"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    Header always set Access-Control-Allow-Credentials "true"
    Header always set Access-Control-Max-Age "86400"

    # Preflight (OPTIONS) — 204 bez dotykania PHP
    <If "%{REQUEST_METHOD} = 'OPTIONS'">
        Header set Content-Length "0"
        Header set Content-Type "text/plain"
        RewriteRule ^ - [R=204,L]
    </If>
</IfModule>