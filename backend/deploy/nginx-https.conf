# PBS Backend — przykład konfiguracji nginx (HTTPS / TLS 1.3)
# Dokumentacja techniczna sekcja 9.1 (TLS) i 9.3 (REST API Security).
# Skopiuj do /etc/nginx/sites-available/ i dostosuj ścieżki/domeny.

# === Blok HTTP → HTTPS (przekierowanie) ===
server {
    listen 80;
    listen [::]:80;
    server_name api.pbs.pl;

    # Przekierowanie całego ruchu na HTTPS (HSTS egzekwowany po przejściu).
    return 301 https://$host$request_uri;
}

# === Blok HTTPS (TLS 1.3, TLS 1.2 jako fallback) ===
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pbs.pl;

    root /var/www/pbs/backend/public;
    index index.php;

    # === TLS: TLS 1.3 wymuszony, TLS 1.2 jako fallback (restrykcyjne cipher suites) ===
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Certyfikaty (Let's Encrypt / inny CA)
    ssl_certificate     /etc/letsencrypt/live/api.pbs.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pbs.pl/privkey.pem;

    # === Nagłówki bezpieczeństwa (dokumentacja 9.3.1) ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # CSP dla API (backend zwraca też własny nagłówek przez SecurityHeadersMiddleware)
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Nie indeksuj ani nie buforuj odpowiedzi API
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Ukryj wersję PHP / nginx
    server_tokens off;

    # Limity żądań (dodatkowa warstwa rate limiting na poziomie proxy)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }
}
