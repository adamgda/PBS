# Konfiguracja środowiskowa ładowana z backend/.env (gitignored).
# Wszystkie zmienne (DATABASE_*, MYSQL_*, JWT_*, itp.) są definiowane w jednym pliku: backend/.env.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pbs-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    env_file:
      - backend/.env
    environment:
      # W kontenerze backend łączy się z bazą przez hostname "db", nie 127.0.0.1
      - DATABASE_HOST=db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pbs-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  db:
    image: mysql:8.4
    container_name: pbs-db
    # W środowisku produkcyjnym USUNĄĆ mapowanie portów — kontenery komunikują się
    # w sieci Docker. W dev dostęp tylko z localhost (127.0.0.1), nigdy 0.0.0.0.
    ports:
      - "127.0.0.1:3307:3306"
    env_file:
      - backend/.env
    volumes:
      - pbs-db-data:/var/lib/mysql

volumes:
  pbs-db-data: