services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pbs-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=srv82152_PBS
      - DATABASE_LOGIN=srv82152_PBS
      - DATABASE_PASSWORD=PtMsJaQLk7t428ze8haA

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pbs-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  db:
    image: mysql:8.4
    container_name: pbs-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: srv82152_PBS
      MYSQL_USER: srv82152_PBS
      MYSQL_PASSWORD: PtMsJaQLk7t428ze8haA
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - pbs-db-data:/var/lib/mysql

volumes:
  pbs-db-data: