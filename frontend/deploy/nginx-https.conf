# PBS Frontend — konfiguracja nginx (HTTPS / TLS 1.3) dla aplikacji Angular (SPA)
# Skopiuj do /etc/nginx/sites-available/ i dostosuj domenę/ścieżki.
#
# WAŻNE: reguła "try_files $uri $uri/ /index.html;" (SPA fallback) jest niezbędna,
# żeby twarde odświeżenie (Ctrl+Shift+R) na trasie typu /pracownicy nie zwracało 404.

# === Blok HTTP → HTTPS (przekierowanie) ===
server {
    listen 80;
    listen [::]:80;
    server_name pbs.adammz.pl;

    return 301 https://$host$request_uri;
}

# === Blok HTTPS (TLS 1.3, TLS 1.2 jako fallback) ===
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pbs.adammz.pl;

    # Document root = zbudowany frontend (dist/frontend po spłaszczeniu)
    root /var/www/pbs/frontend;
    index index.html;

    # === TLS ===
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    ssl_certificate     /etc/letsencrypt/live/pbs.adammz.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pbs.adammz.pl/privkey.pem;

    # === Nagłówki bezpieczeństwa ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === SPA fallback: wszystkie nieistniejące ścieżki → index.html ===
    # To naprawia 404 przy twardym odświeżeniu (Ctrl+Shift+R) na trasach Angulara.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === Service worker (ngsw) — nie buforuj, żeby aktualizacje działały ===
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # === Statyczne pliki z hashem — długi cache (bezpieczne, bo nazwy są hashowane) ===
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    server_tokens off;
}
