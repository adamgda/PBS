  >
  <!-- Favicon — pojedyncze skalowalne SVG dla wszystkich urządzeń -->

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
  <script>
    // Wczesne ustawienie motywu (przed renderem Angulara) — zapobiega „flash of unstyled content".
    // Domyślnie tryb jasny; ciemny tylko, gdy użytkownik jawnie zapisał wybór w localStorage.
    (function () {
      try {
        var stored = localStorage.getItem('pbs-theme');
        if (stored === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
