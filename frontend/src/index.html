<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>PORTBS — Port Baltic Shipping</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="System zarządzania operacjami portowymi">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
  <script>
    // Wczesne ustawienie motywu (przed renderem Angulara) — zapobiega „flash of unstyled content".
    (function () {
      try {
        var stored = localStorage.getItem('pbs-theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
