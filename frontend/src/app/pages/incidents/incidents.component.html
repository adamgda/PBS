<!-- Nagłówek sekcji -->
<div>
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ 'awaria.title' | translate }}</h1>
  <p class="mt-1 text-gray-600 dark:text-slate-400">{{ 'awaria.subtitle' | translate }}</p>
</div>

<!-- Lista awarii -->
<div class="mt-5">
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">{{ 'awaria.list.title' | translate }}</h2>
    <app-add-button [label]="'awaria.buttons.add'" (add)="openCreate()" />
  </div>

  <app-filter-bar
    [filters]="filterConfigs()"
    [values]="_filters()"
    (filterApply)="onFilterApply($event)"
    (filterClear)="onFilterClear()"
  />

  <app-data-table
    [columns]="columns()"
    [data]="incidents()"
    [total]="total()"
    [page]="page()"
    [perPage]="perPage()"
    [loading]="loading()"
    [sortKey]="sortKey()"
    [sortDirection]="sortDirection()"
    [rowClickable]="true"
    [cellTemplates]="{ typ: typeCellTpl, status: statusCellTpl, opis: opisCellTpl, zrodlo: sourceCellTpl }"
    (rowClick)="openDetails($event)"
    (sortChange)="onSort($event)"
    (pageChange)="onPageChange($event)"
    (perPageChange)="onPerPageChange($event)"
  />

  <ng-template #typeCellTpl let-inc>
    <span class="inline-flex items-center rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-700 dark:bg-slate-800 dark:text-slate-300">
      {{ typeLabel(inc) }}
    </span>
  </ng-template>

  <ng-template #opisCellTpl let-inc>
    <span class="line-clamp-1 max-w-xs text-gray-600 dark:text-slate-400">{{ inc.opis }}</span>
  </ng-template>

  <ng-template #statusCellTpl let-inc>
    <app-status-badge [status]="statusBadgeStatus(inc.status)" [labelKey]="statusBadgeKey(inc.status)" />
  </ng-template>

  <ng-template #sourceCellTpl let-inc>
    @if (inc.zrodlo === 'qr') {
      <span class="inline-flex items-center gap-1 rounded-full bg-pbs-primary/10 px-2 py-0.5 text-xs font-semibold text-pbs-primary">
        <app-svg-icon name="qr" size="sm" />
        {{ 'awaria.source.qr_badge' | translate }}
      </span>
    }
  </ng-template>
</div>
