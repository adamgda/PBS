<app-offline-banner />

<app-toast-notification />

<app-confirm-dialog />

@if (isLoggedIn()) {
  <!-- Layout z nawigacją dla zalogowanych -->
  <nav class="bg-pbs-primary text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-2">
          <span class="font-bold text-lg">PBS</span>
        </div>
        <div class="hidden md:flex items-center gap-1">
          @for (item of visibleMenuItems(); track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-white/20"
              class="px-3 py-2 rounded text-sm font-medium hover:bg-white/10 transition-colors"
            >
              {{ item.label | translate }}
            </a>
          }
        </div>
        <button
          type="button"
          class="px-3 py-1.5 rounded text-sm font-medium bg-white/10 hover:bg-white/20 transition-colors"
          (click)="logout()"
        >
          {{ 'common.auth.logout' | translate }}
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <router-outlet />
  </main>
} @else {
  <!-- Tylko router-outlet dla stron publicznych (login) -->
  <router-outlet />
}
